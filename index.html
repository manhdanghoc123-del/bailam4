<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình đơn thả xuống ngang (Horizontal Dropdown Menu)</title>
    <style>
        /* 1. Đặt phông chữ chung cho trang và định dạng phân vùng trình đơn #menu */
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
        }

        #menu {
            height: 40px;
            background-color: #333;
            border-bottom: 2px solid #111;
        }

        #menu ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        /* 2. Định nghĩa bộ chọn cho các phần tử danh sách (li) nằm ngang */
        #menu li {
            float: left;
            position: relative;
        }

        /* 3. Định nghĩa bộ chọn cho các liên kết (thẻ a) trong trình đơn */
        #menu a {
            display: block;
            width: 120px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            background-color: #333;
            font-weight: bold;
        }

        /* 4. Đổi màu nền sang màu đỏ khi di chuột qua liên kết */
        #menu a:hover {
            background-color: #e74c3c;
        }

        /* 5 & 6. Định vị và ẩn các danh sách con (trình đơn con) */
        #menu ul ul {
            position: absolute;
            top: 40px;
            left: 0;
            visibility: hidden; /* Mặc định ẩn trình đơn con */
        }

        /* Xếp các mục trong trình đơn con theo hàng dọc */
        #menu ul ul li {
            float: none;
        }

        /* 7. Hiển thị trình đơn con khi đưa con trỏ chuột qua mục chọn của trình đơn cha */
        #menu li:hover > ul {
            visibility: visible;
        }
    </style>
</head>
<body>

    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li>
                <a href="#">Sản phẩm</a>
                <ul>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Máy tính</a></li>
                    <li><a href="#">Phụ kiện</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Dịch vụ</a>
                <ul>
                    <li><a href="#">Bảo hành</a></li>
                    <li><a href="#">Sửa chữa</a></li>
                </ul>
            </li>
            <li><a href="#">Tin tức</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

</body>
</html>
